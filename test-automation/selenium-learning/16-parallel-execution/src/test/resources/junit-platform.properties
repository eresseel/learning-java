# JUnit konfiguráció (a teszt classpath gyökerében lévő fájlt a JUnit automatikusan beolvassa).
# A párhuzamos futtatás be van kapcsolva:
junit.jupiter.execution.parallel.enabled=true
# Alapértelmezetten a tesztmetódusok és az osztályok is egyszerre (párhuzamosan) futhatnak.
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent
# Fix számú szálat használunk: egyszerre legfeljebb 3 teszt (3 böngésző) fut.
junit.jupiter.execution.parallel.config.strategy=fixed
junit.jupiter.execution.parallel.config.fixed.parallelism=3
