# A webshop SUT beállításai.
spring.application.name=webshop
# Alapértelmezett port; tesztben (RANDOM_PORT) ezt véletlen port írja felül.
server.port=8080
# RFC 9457 (Problem Details) formátumú hibaválaszok a Spring saját kivételeihez is.
spring.mvc.problemdetails.enabled=true
# Ismeretlen JSON mezőt a kérésben nem tűrünk el: így a hibás kliens (vagy teszt) azonnal kiderül.
spring.jackson.deserialization.fail-on-unknown-properties=true

# A külső fizetési szolgáltató ("PayPal") elérése. Az alapértelmezett cím fiktív helyi sandbox;
# tesztben a WireMock szerver címe írja felül, élesben környezeti változó (PAYPAL_BASE_URL).
paypal.base-url=http://localhost:8089
# Válaszidő-korlát: ennyi után a fizetést időtúllépésnek tekintjük (504-et adunk).
paypal.timeout=2s

# Megfigyelhetőség (VI. fejezet): a naplósorokba a kérés korrelációs azonosítója is bekerül,
# így a TAS naplója és a SUT naplója összekapcsolható.
logging.pattern.correlation=[cid:%X{correlationId:-}]\u0020
# Csak a health végpontot tesszük elérhetővé (a preflight ellenőrzéshez).
management.endpoints.web.exposure.include=health
