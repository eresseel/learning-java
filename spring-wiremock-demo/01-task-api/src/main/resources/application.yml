# Production konfiguráció – valós DB-t vár (pl. Docker Compose)
# A tesztek felülírják ezt a 02/03 modulokban Testcontainers-szel
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/taskdb
    username: taskuser
    password: taskpass
  jpa:
    hibernate:
      ddl-auto: validate          # production-ban validate, nem create-drop
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: false                # Flyway-t a tesztek sem használnak, DDL auto-ban maradunk

server:
  port: 8080
